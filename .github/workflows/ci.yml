name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking on every push and pull request: data builds in local mode
  # (structural and safety rules fail; editorial problems are only reported).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:local
      - run: test -f out/index.html
      # Smoke tests against the static export (roadmap tasks 4.4 and 4.5)
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Release-mode build on main and on pull requests. Blocking since Phase 12 cleared the editorial
  # problems (roadmap task 1.13, spec 12 FR-26): a new internal note, unreviewed cell or
  # non-standard credit fails it. Its report is kept as an artifact either way.
  release:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-problems
          path: data/reports/release-problems.md
          if-no-files-found: warn
