name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking on every push and pull request: data builds in local mode
  # (structural and safety rules fail; editorial problems are only reported).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Runtime dependencies only: high or critical findings fail (roadmap 13.10, spec 13 FR-33)
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      # The data build comes first: unit tests read data/build/ and public/data/index.json, which are not committed
      - run: npm run build:local
      - run: npm test
      - run: test -f out/index.html
      # Link and leak checks and the size budgets over the export (roadmap 13.1, 13.9; spec 13 FR-2, FR-29 to FR-32)
      - run: npm run check:out
      - run: npm run check:budgets
      # Smoke tests against the static export (roadmap tasks 4.4 and 4.5)
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Release-mode build on main and on pull requests. Blocking since Phase 12 cleared the editorial
  # problems (roadmap task 1.13, spec 12 FR-26): a new internal note, unreviewed cell or
  # non-standard credit fails it. Its report is kept as an artifact either way.
  release:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # SITE_URL is the Lighthouse server's origin, so canonical links are absolute as in production (spec 13 FR-35).
      # This build is checked, never deployed.
      - run: npm run build
        env:
          SITE_URL: http://localhost:4174
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-problems
          path: data/reports/release-problems.md
          if-no-files-found: warn
      - run: npm run check:out
      - run: npm run check:budgets
      # Lighthouse needs an indexable build for SEO, so it runs here, not on the local build (spec 13 FR-1, FR-5)
      - run: npx playwright install --with-deps chromium
      - run: npm run lighthouse
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouse/
          if-no-files-found: ignore
